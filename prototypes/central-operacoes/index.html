<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11130f" />
    <meta name="description" content="Exploração visual isolada da Central de Operações do SquadOne." />
    <title>SquadOne · Central conectada — Protótipos</title>
    <link rel="stylesheet" href="./styles.css?v=connected-workspace-1" />
    <script src="./app.js?v=connected-workspace-1" defer></script>
    <script src="./variant-command.js?v=connected-workspace-1" defer></script>
    <script src="./variant-portfolio.js?v=connected-workspace-1" defer></script>
    <script src="./variant-flow.js?v=connected-workspace-1" defer></script>
  </head>
  <body>
    <div id="stage" aria-live="off"></div>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Comando</button>
      <button class="proto-picker-item">Portfólio</button>
      <button class="proto-picker-item">Fluxo</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <div class="prototype-toast" id="prototype-toast" role="status" aria-live="polite" hidden>
      <strong>Protótipo</strong>
      <span id="prototype-toast-message">Ação demonstrativa.</span>
      <button type="button" data-close-toast aria-label="Fechar aviso">×</button>
    </div>
  </body>
</html>
