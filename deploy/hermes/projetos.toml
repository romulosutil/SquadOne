dono = "Rômulo"
estado = "existe"
grafo = true
papel = "Código da Central, dos agentes, do Hermes e dos scripts do Dell. É o checkout que a Central roda: não editar nem trocar de branch aqui; trabalhar num worktree (~/.cache/mel-work/SquadOne) e entregar por pull request."

