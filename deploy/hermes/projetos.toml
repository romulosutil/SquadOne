# Registro de projetos da Mel: um caminho canônico por projeto.
#
# É a fonte para as máquinas (o Hermes lê este arquivo). A versão para humanos,
# ~/PRUMO/PROJETOS.md, é GERADA daqui, então as duas nunca divergem:
#   python3 deploy/hermes/scripts/projetos_verificar.py --md > ~/PRUMO/PROJETOS.md
# Para conferir (caminhos, duplicatas, origin dos clones, pastas fora do registro):
#   python3 deploy/hermes/scripts/projetos_verificar.py
#
# Regras, para qualquer agente (Claude, Codex, Hermes), no Dell e no PC:
# 1. Antes de criar pasta ou clonar, leia este registro. Se o projeto existe,
#    trabalhe nele; nada de "outra cópia ao lado".
# 2. Projeto novo entra aqui primeiro. Só depois nasce a pasta.
# 3. Cópia de leitura é "espelho" (tipo abaixo) e ninguém edita nela.
# 4. Para guardar uma versão, use ~/Arquivo/<AAAA-MM-DD>, nunca uma pasta ao lado.
#
# Campos de cada [[projeto]]:
#   nome         chave única (para quem não é pasta do disco, o nome no grafo).
#   caminho      único no registro. "~/" é a home do Dell.
#   repositorio  "dono/nome" no GitHub; "" se não há; "dono/*" para uma área
#                que guarda vários espelhos.
#   tipo         clone-vivo (Git atualizado do GitHub, o Dell opera);
#                espelho (clone raso do Hermes, ninguém edita);
#                pasta (sem Git, ou sem repositório próprio);
#                congelado (réplica antiga do PC, só consulta).
#   dono         Rômulo (edita) ou Hermes (a Mel mantém sozinha).
#   estado       existe | a-criar (a pasta nasce numa fase futura).
#   grafo        o graphify lê esta pasta? (decisão padrão; a Fase 4 aplica).
#   papel        uma linha: para que serve.
# Opcionais: dentro_de (nome do projeto cujo caminho contém este), worktrees,
#   cobertura_github, observacao, grupo ("Frente · Parte": o PROJETOS.md junta as
#   entradas da mesma Frente num mapa só, ex.: Silmer · Site, Silmer · CRM,
#   Silmer · Marketing).

[geral]
# Repositório do GitHub maior que isto (em MB) não ganha espelho nem grafo: o
# graphify_projetos.py avisa na fila e segue. Sobe-se aqui, por pull request.
graphify_limite_repo_mb = 300
# Pastas de topo da home que não são projeto (as do sistema e do snap).
home_ignorar = [
  "Documentos", "Downloads", "Imagens", "Modelos", "Músicas", "Público",
  "Vídeos", "Área de trabalho", "snap",
]

