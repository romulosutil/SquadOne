[Service]
# O perfil AppArmor do Bubblewrap permite montar o SQLite no namespace da Central.
# O prefixo delega a montagem ao Bubblewrap no gerenciador de usuario.
ExecStart=
ExecStart=+/usr/bin/bwrap --die-with-parent --cap-drop ALL --bind / / --ro-bind %h/.local/share/frente-comercial/registro.sqlite %h/.local/share/frente-comercial/registro.sqlite -- /usr/bin/npm start
