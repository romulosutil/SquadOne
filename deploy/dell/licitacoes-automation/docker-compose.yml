services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [licitacoes]

  collector:
    image: n8nio/n8n:2.38.7
    entrypoint: ["node"]
    command: ["/opt/licitacoes/scripts/collector-server.mjs"]
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      RADAR_DATA_DIR: /data
      PNCP_MAX_PAGES: 20
      PNCP_REQUEST_TIMEOUT_MS: 90000
      PNCP_MAX_ATTEMPTS: 3
      PNCP_RETRY_DELAY_MS: 15000
    volumes:
      - ./scripts:/opt/licitacoes/scripts:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [licitacoes]

  n8n:
    image: n8nio/n8n:2.38.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_healthy
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5679/
      N8N_WEBHOOK_URL: http://127.0.0.1:5679/
      # Acesso só por loopback/túnel SSH, sem https: cookie seguro derrubava a sessão.
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      # Em HORAS (o padrão do n8n é 336 = 14 dias). Até 30/09/2026 estava 14, e o
      # n8n apagava tudo com mais de 14 h: o Caçador (06:00) sumia à noite.
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/opt/licitacoes/scripts:ro
      - ./workflows:/opt/licitacoes/workflows:ro
      - ../prumo-automation:/opt/prumo:ro
      - ./data:/data
      # Fila de avisos: arquivo JSON aqui vira WhatsApp pelo Hermes (dell-status).
      - ${HOME}/.local/share/avisos/fila:/home/node/.n8n-files/avisos
      # Pasta auto (Site antes da venda). O espelho em G:\Meu Drive\auto, pelo
      # PC, parou em 25/09/2026 (PC queimado): esta pasta é a de verdade.
      - ${HOME}/auto-site:/home/node/.n8n-files/auto
      # Pacotes do Caçador: ~/.local/bin/auto-entrada cria as pastas em ~/auto-site.
      - ${HOME}/.local/share/auto-entrada:/home/node/.n8n-files/auto-entrada
      # Pendências para a Central (lidas pelo dell-status).
      - ${HOME}/.local/share/n8n-estado:/home/node/.n8n-files/estado
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        marker=/home/node/.n8n/bootstrap-v1
        if [ ! -f "$$marker" ]; then
          n8n import:workflow --input=/opt/licitacoes/workflows/radar-pncp.json
          n8n import:workflow --input=/opt/prumo/prumo-lead-scout-v1.n8n.json
          n8n import:workflow --input=/opt/prumo/prumo-diagnostic-score-v1.n8n.json
          touch "$$marker"
        fi
        exec n8n start
    dns: [1.1.1.1, 8.8.8.8]
    networks: [licitacoes]

networks:
  licitacoes:
    name: licitacoes_n8n_network

volumes:
  n8n_db:
    name: licitacoes_n8n_db
  n8n_data:
    name: licitacoes_n8n_data
