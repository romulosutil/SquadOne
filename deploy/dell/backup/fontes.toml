# Backup do Dell para o Google Drive: o que vai, para onde, e quando avisar.
#
# Uma fonte nova é um bloco novo aqui; o runner (backup-dell.py) não muda.
# Instalado em ~/.config/backup-dell/fontes.toml (ver README.md ao lado).
#
# Duas classes, decididas em 28/09/2026:
# - espelho: cópia legível, só num sentido (Dell → Drive). O Dell é a verdade;
#   o que alguém mudar ou apagar no Drive é refeito na rodada seguinte, e a
#   versão anterior fica na lixeira por 30 dias.
# - cofre: restic cifrado com a home inteira menos o que se reinstala, mais
#   dumps consistentes do n8n e dos SQLite do Hermes. É o que refaz o Dell.
#
# Caminhos com "~/" são relativos à home do Dell. Caminhos no Drive são
# relativos à raiz do remote do rclone.

[geral]
# Remote do rclone com escopo drive.file: ele só enxerga o que ele mesmo criou.
# Um defeito aqui não alcança o resto do Drive, e pastas criadas à mão com o
# mesmo nome ficam invisíveis para ele (ele criaria outra).
remoto = "gdrive"
# O que o espelho apaga ou troca vai para <lixeira>/<id>/<AAAA-MM-DDTHH>.
lixeira = "PRUMO/_lixeira"
lixeira_dias = 30
# De dia o backup não disputa a rede com o resto (formato do --bwlimit).
banda = "08:00,2M 23:00,off"
# Espelho e cofre usam a mesma trava: os dois regravam o rclone.conf quando o
# token renova e não podem fazer isso ao mesmo tempo.
espera_trava_min = 5

[[espelho]]
id = "sites"
nome = "Sites antes da venda"
origem = "~/auto-site"
destino = "PRUMO/Sites antes da venda"
intervalo_h = 1
atencao_h = 3
falha_h = 24
# Sem este arquivo a origem é tratada como vazia ou desmontada e a rodada para:
# um sync de origem vazia apagaria o espelho inteiro.
sentinela = "CLAUDE.md"
# Mover muitos leads de uma vez (ex.: para _recusados) gera apagamentos; acima
# disso a rodada falha e pede confirmação (backup-dell espelho --sem-limite).
max_apagar = 500
# O gerador escreve index.html e publicado.json durante a rodada das 08h;
# enquanto a trava dele for recente, o espelho espera (estado "adiado").
adiar_se_recente = { arquivo = ".logs/gerador.lock", horas = 4 }
# .claude/, .agents/ e CLAUDE.md vão junto: fazem parte da esteira.
excluir = [
  "/.logs/**", "/.playwright-mcp/**", "/.tokensave/**", "/.headroom/**",
  "/.impeccable/**", "/.stfolder/**", "/.stversions/**", "/graphify-out/**",
  "*.parcial", "*.tmp", "/.parar",
]
leia_me = """Espelho da pasta ~/auto-site do Dell (esteira Site antes da venda do PRUMO).
Atualizado a cada hora, só no sentido Dell -> Drive.
Editar ou apagar aqui não volta para o Dell e é desfeito na rodada seguinte.
O que o espelho apagou ou trocou fica 30 dias em PRUMO/_lixeira/sites.
"""

[[espelho]]
id = "consultoria"
nome = "PRUMO — consultoria"
origem = "~/prumo"
destino = "PRUMO/Consultoria"
intervalo_h = 24
atencao_h = 30
falha_h = 72
sentinela = "README.md"
max_apagar = 200
excluir = ["/.git/**", "/graphify-out/**"]
leia_me = """Espelho do repositório romulosutil/prumo (~/prumo no Dell), a fonte da verdade do PRUMO.
Atualizado uma vez por dia, só no sentido Dell -> Drive. Para editar, edite o repositório.
"""

[[espelho]]
id = "entregas"
nome = "PRUMO — entregas"
origem = "~/prumo-entregas"
destino = "PRUMO/Entregas"
intervalo_h = 24
atencao_h = 30
falha_h = 72
# Rascunhos do Mapa gerados pelo prumo-mapa (29/09/2026). Dado de cliente: fica
# fora do repositório ~/prumo, e o Drive é a cópia legível.
sentinela = "LEIA-ME.txt"
max_apagar = 50
excluir = ["*.parcial"]
leia_me = """Rascunhos do Mapa gerados no Dell (~/prumo-entregas).
Atualizado uma vez por dia, só no sentido Dell -> Drive. Editar aqui não volta para o Dell.
"""

# A pasta Estrutura (decisão de 04/10/2026): o mapa e as configurações da Mel e do PC,
# sem segredo. É o destino final de tudo que descreve a operação; o Rômulo a lê pelo PC.
# Remote próprio (gdrive-estrutura = cópia do gdrive-silmer com a raiz na pasta Estrutura:
# o remote "gdrive" tem escopo drive.file e não enxerga pasta criada à mão).
[[espelho]]
id = "estrutura"
nome = "Estrutura"
origem = "~/.local/share/mel/estrutura"
destino = ""                       # a raiz do remote é a própria pasta Estrutura
remoto = "gdrive-estrutura"
lixeira = "_lixeira"               # dentro da Estrutura, fora do que o sync gerencia (ver incluir)
# Só dell/ e pc/ são do espelho: o que o Rômulo guardar na raiz da Estrutura não é tocado.
incluir = ["/dell/**", "/pc/**"]
# Uma vez por dia, de madrugada (o timer do espelho é de hora em hora). 10 h, e não 24, porque
# com janela uma rodada manual no meio do dia empurraria o dia seguinte para fora dela: o bloco
# só roda quando passou o intervalo e o relógio está na janela, então uma rodada manual às T h
# precisa de T + 10 <= 06:00, ou seja, até as 20h. Com 12 h o limite era 18h, e a rodada manual
# das 18:23 de 04/10 fez a coleta de 05/10 não rodar.
intervalo_h = 10
janela = ["04:00", "06:00"]
atencao_h = 30
falha_h = 72
sentinela = "dell/MANIFESTO.md"
max_apagar = 40
# O coletor tem unidade própria porque aqui o sandbox do espelho (NoNewPrivileges) impediria o
# `sudo ufw status`. Se ele falhar (segredo achado, manifesto ausente), nada é enviado.
preparo = ["systemctl --user start estrutura-coletar.service"]
preparo_timeout_s = 600
leia_me = """Estrutura: o mapa e as configurações da Mel (o Dell) e do PC, sem segredos.
dell/  gerado todo dia às 4h pelo estrutura-coletar (manifesto, projetos, units do systemd, compose,
       fluxos do n8n, repositórios, estado da rede). Veja dell/COLETA.md.
pc/    enviado pelo PC.
Só leitura: o que mudar em dell/ ou pc/ é desfeito na rodada seguinte (a versão anterior fica 30 dias em _lixeira/).
O que estiver fora de dell/ e pc/ não é tocado.
"""

[cofre]
repositorio = "rclone:gdrive:Backups/dell-worker/restic"
senha = "~/.config/backup-dell/restic.senha"
raiz = "~"
atencao_h = 26
falha_h = 50
reter = { diarios = 7, semanais = 4, mensais = 6 }
# Uma rodada que acrescenta mais que isso quase sempre é pasta nova grande que
# ninguém classificou; vira atenção para alguém decidir se exclui.
alerta_mb = 500
# Se algum destes sumir, o cofre não refaz o Dell: vira atenção.
obrigatorios = [
  "~/.hermes/.env", "~/.hermes/config.yaml", "~/.hermes/cron/jobs.json",
  "~/.hermes/memories", "~/licitacoes-automation/.env",
  "~/.config/claude-ops", "~/.config/squadone", "~/.config/rclone/rclone.conf",
  "~/SquadOne/.env", "~/SquadOne/data", "~/.ssh", "~/.local/state/syncthing",
  # Fase 6 (Entrada): sem a identidade da Mel e sem o cofre, o que foi guardado como segredo não se abre.
  # Hoje a identidade está sem senha (decisão de 04/10); se for protegida (bin/proteger-identidade),
  # troque por "~/.config/mel/age/identity.txt.age". Este cofre do backup é cifrado pelo restic.
  "~/.config/mel/age/identity.txt", "~/Mel/Cofre",
  # Cópia manual do roster do Easypanel (o de verdade; o ~/SquadOne/data do Dell é de 14/09/2026).
  # Como copiar: deploy/dell/README.md, "Cópia do roster do Easypanel".
  "~/Mel/Easypanel/squad.json",
  # Finanças (06/10/2026): a cópia que o SquadOne faz com VACUUM INTO depois de
  # cada sincronização e importação (600, consistente). Só existe depois da
  # primeira leitura da Pluggy. Restaurar: RESTAURAR.md, "Finanças".
  "~/.local/share/squadone-operations/financas.copia.db",
]
# Reinstalável, regenerável ou grande sem valor de restauração. Padrão sem "/"
# vale em qualquer nível (regra do restic).
excluir = [
  "~/.cache", "~/snap", "~/.npm", "~/.local/lib", "~/.local/share/uv",
  "~/.local/share/Trash", "~/.local/share/containers", "~/.config/Claude",
  "~/.antigravity-ide-server", "~/.config/google-chrome*", "~/.local/opt",
  "~/.agent-browser/browsers", "~/.cua-driver/packages", "~/.graphify",
  "~/.hermes/hermes-agent", "~/.hermes/tools", "~/.hermes/venv*",
  "~/.hermes/cache", "~/.hermes/*_cache", "~/.hermes/*cache*.json",
  "~/.hermes/backups", "~/.hermes/chrome-debug", "~/.hermes/lsp",
  "~/.hermes/bin", "~/.hermes/installs", "~/.hermes/state-snapshots",
  # O financas.db vivo (WAL) fica fora: copiado cru no meio de uma escrita viria
  # corrompido. Quem entra é a financas.copia.db, ao lado (RULES 24: só no cofre).
  "~/.local/share/squadone-operations/financas.db",
  "~/.local/share/squadone-operations/financas.db-*",
  "~/.local/share/squadone-operations/financas.copia.db.tmp",
  # Os SQLite vivos do Hermes entram pelo preparo, copiados de forma consistente.
  "~/.hermes/*.db", "~/.hermes/*.db-*", "~/.hermes/cron/*.db", "~/.hermes/cron/*.db-*",
  "~/.local/state/syncthing/index-*", "~/.local/state/backup-dell/ensaio",
  "~/qa-shots", "~/shots", "~/tmp-shots", "~/.qa-shots", "~/*.png", "~/*.deb",
  "~/auto-site/.playwright-mcp",
  # Espelhos do GitHub e cópias dos grafos: o graphify_projetos.py refaz tudo
  # (o código está no GitHub e o grafo se regenera em minutos).
  "~/Mel/Repos", "~/Mel/Grafos",
  "node_modules", ".gocache*", ".gomodcache", "graphify-out", "__pycache__",
  ".venv", "venv", "venv-*",
  # Travas de navegador (Chrome, Codex, Claude): links sem alvo que o restic
  # não lê e que fariam toda rodada sair com "arquivos não puderam ser lidos".
  "Singleton*",
  # Saída do container MoneyPrinterTurbo, gravada como root (cache de busca,
  # vídeos gerados, script.json com modo 600): o restic não lê e cada tarefa
  # nova repetiria o aviso. Regenerável; config.toml e o compose continuam no cofre.
  "~/workspace/moneyprinterturbo/storage",
]

# Rodados antes de cada cópia; o resultado vai para ~/.local/state/backup-dell/preparo
# e entra no cofre junto com a home.
[[cofre.preparo]]
tipo = "postgres"
nome = "n8n"
compose = "~/licitacoes-automation/docker-compose.yml"
servico = "db"
banco = "n8n"
env = "~/licitacoes-automation/.env"

[[cofre.preparo]]
tipo = "pasta-do-container"
nome = "n8n-home"
compose = "~/licitacoes-automation/docker-compose.yml"
servico = "n8n"
pasta = "/home/node/.n8n"
# O config guarda a encryptionKey; nodes/ e storage/ os pacotes instalados.
excluir = ["n8nEventLog*", "crash.journal"]

[[cofre.preparo]]
tipo = "sqlite"
nome = "hermes"
arquivos = ["~/.hermes/*.db", "~/.hermes/cron/*.db"]

# Bancos Docker dos projetos (06/10/2026: "nenhum é descartável"). Até aqui só o
# volume do Docker os guardava, e /var/lib/docker fica fora da home: o cofre não
# os tinha. Postgres sem `banco` = pg_dumpall do cluster inteiro (todos os bancos
# e papéis: o iris tem sete bancos, o crm-silmer três). Usuário e senha vêm de
# dentro do container. Dump que falha deixa o cofre em falha (backup-dell.py,
# eh_critico). Prova da restauração: `backup-dell ensaio-dump <nome>`.
[[cofre.preparo]]
tipo = "postgres"
nome = "aladdin-pg"
compose = "~/workspace/infra-docker/aladdin/docker-compose.yml"
servico = "db"

[[cofre.preparo]]
tipo = "postgres"
nome = "crm-silmer-pg"
compose = "~/workspace/infra-docker/crm-silmer/docker-compose.yml"
servico = "postgres"

[[cofre.preparo]]
tipo = "postgres"
nome = "p4f-db"
compose = "~/workspace/infra-docker/p4f/docker-compose.yml"
servico = "db"

[[cofre.preparo]]
tipo = "postgres"
nome = "iris-pg"
compose = "~/workspace/infra-docker/iris/docker-compose.yml"
servico = "postgres"

# Os objetos do MinIO do iris (bucket = pastas em /data). A imagem do MinIO não
# tem tar: ele roda numa imagem que já está no Dell, com os volumes do serviço
# montados só para leitura.
[[cofre.preparo]]
tipo = "pasta-do-container"
nome = "iris-minio"
compose = "~/workspace/infra-docker/iris/docker-compose.yml"
servico = "minio"
pasta = "/data"
imagem = "postgres:17-alpine"
critico = true

# Todos os bancos menos os de sistema; o usuário do app o compose recria.
[[cofre.preparo]]
tipo = "mysql"
nome = "espectro-mysql"
compose = "~/workspace/infra-docker/espectro/docker-compose.yml"
servico = "mysql"
