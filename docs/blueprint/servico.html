<meta charset="utf-8">
<title>Service blueprint do SquadOne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* Mesma linguagem do app (src/estilos/tokens.css e design.md, "Neobrutalismo saudável", main aec37b2):
   Inter, tinta sobre papel, amarelo para o escolhido, um nível de contorno de 2 px (cartão, campo,
   botão, painel), canto 16/10/6 px, sombra dura só no "Copiar para a conversa" (o primário).
   A partir de 60 rem: quadro da NN/g (uma coluna por passo, uma linha por faixa) e painel à direita.
   Abaixo: lista por passo, e o cartão abre numa folha que sobe de baixo. Só um dos dois no DOM. */
:root {
  --cor-tinta: #11130f;
  --cor-papel: #f4f0e6;
  --cor-papel-forte: #fffdf6;
  --cor-papel-azul: #dce3ff;
  --cor-amarelo: #ffdc59;
  --cor-coral: #ff966f;
  --cor-apagado: #565c55;

  --fundo: var(--cor-papel-azul);
  --superficie: var(--cor-papel-forte);
  --superficie-2: var(--cor-papel);
  --texto: var(--cor-tinta);
  --texto-2: var(--cor-apagado);
  --borda: var(--cor-tinta);
  --destaque: var(--cor-amarelo);
  --destaque-texto: var(--cor-tinta);
  --acento: var(--cor-coral);
  --sobre-pastel: var(--cor-tinta);
  --foco: #1e64d4;
  --hover: var(--superficie-2);
  --veu: rgba(17, 19, 15, 0.45);

  --realce: #fff3c4;
  --linha: 2px solid var(--borda);
  --linha-fina: 1px solid var(--borda);
  --divisor: 1px solid color-mix(in srgb, var(--borda) 35%, transparent);
  --sombra: 4px 4px 0 var(--borda);
  --sombra-pequena: 2px 2px 0 var(--borda);
  /* Por dentro sempre menor que por fora: folha 16, cartão e controle 10, selo 6. */
  --raio-bloco: 16px;
  --raio-controle: 10px;
  --raio-selo: 6px;
  --toque: 44px;

  --esp-1: 0.25rem;
  --esp-2: 0.5rem;
  --esp-3: 0.75rem;
  --esp-4: 1rem;
  --esp-5: 1.25rem;
  --esp-6: 1.5rem;
  --esp-8: 2rem;
  --respiro-bloco: var(--esp-5);
  --respiro-pilha: var(--esp-6);
  --respiro-interno: var(--esp-3);

  --fonte: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --peso-texto: 450;
  --peso-medio: 600;
  --peso-forte: 700;
  --peso-titulo: 800;
  --tam-mini: 0.75rem;
  --tam-apoio: 0.875rem;
  --tam-texto: 1rem;
  --tam-nome: 1.125rem;
  --tam-secao: 1.375rem;
  --tam-titulo: clamp(1.75rem, 6vw, 2.5rem);
}
@media (min-width: 64rem) {
  :root { --respiro-bloco: var(--esp-6); --respiro-pilha: var(--esp-8); --respiro-interno: var(--esp-4); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #10131a; --superficie: #1b202a; --superficie-2: #242a36; --texto: #f1ede2; --texto-2: #aab2c0;
    --borda: #8792a7; --foco: #8ab4ff; --veu: rgba(0, 0, 0, 0.6); --realce: #2f2a12;
    --sombra: 4px 4px 0 #000; --sombra-pequena: 2px 2px 0 #000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #10131a; --superficie: #1b202a; --superficie-2: #242a36; --texto: #f1ede2; --texto-2: #aab2c0;
  --borda: #8792a7; --foco: #8ab4ff; --veu: rgba(0, 0, 0, 0.6); --realce: #2f2a12;
  --sombra: 4px 4px 0 #000; --sombra-pequena: 2px 2px 0 #000; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--fonte); font-size: var(--tam-texto); font-weight: var(--peso-texto); line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
::selection { background: var(--destaque); color: var(--destaque-texto); }
.codigo { white-space: nowrap; }

/* Casca: no quadro, a tela inteira é do app e só o quadro rola; na lista, a página rola. */
.app.quadro { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.topo { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--esp-4) var(--esp-6); padding: var(--esp-4); border-bottom: var(--linha); background: var(--superficie); }
.topo h1 { font-size: var(--tam-titulo); font-weight: var(--peso-titulo); letter-spacing: -0.02em; line-height: 1.05; }
.topo p { margin-top: var(--esp-1); color: var(--texto-2); font-size: var(--tam-apoio); max-width: 40rem; }
.controles { flex: 1 1 22rem; justify-content: end; display: flex; flex-wrap: wrap; align-items: end; gap: var(--esp-3); }

.segmentado { display: inline-flex; overflow: hidden; border: var(--linha); border-radius: var(--raio-controle); background: var(--superficie); }
.segmentado button { min-height: var(--toque); padding: 0 var(--esp-4); border: 0; background: none; font-weight: var(--peso-forte); cursor: pointer; }
.segmentado button + button { border-left: var(--linha); }
.app.lista .segmentado { flex: 1 1 100%; }
.app.lista .segmentado button { flex: 1; }
.segmentado button:hover { background: var(--hover); }
.segmentado button[aria-pressed="true"] { background: var(--destaque); color: var(--destaque-texto); }

.campo { flex: 1 1 10rem; display: grid; gap: var(--esp-1); font-size: var(--tam-apoio); font-weight: var(--peso-medio); color: var(--texto-2); }
.campo input, .campo select { min-height: var(--toque); padding: 0 var(--esp-3); border: var(--linha); border-radius: var(--raio-controle); background: var(--superficie); color: var(--texto); font-size: var(--tam-texto); font-weight: var(--peso-texto); }
.campo input, .campo select { width: 100%; }
.app.quadro .campo { flex: 0 1 14rem; }
.resultado { flex-basis: 100%; font-size: var(--tam-apoio); font-weight: var(--peso-medio); }
.resultado:empty { display: none; }

.corpo { display: grid; grid-template-columns: minmax(0, 1fr) 25rem; min-height: 0; }
.app.lista .corpo { display: block; }
.palco { min-width: 0; min-height: 0; overflow: auto; }
.app.lista .palco { overflow: visible; padding: var(--esp-4); display: grid; gap: var(--respiro-pilha); }
#intro { padding: var(--respiro-bloco); border: var(--linha); border-radius: var(--raio-bloco); background: var(--superficie); }

/* Cartão do blueprint: igual em todas as faixas; a faixa e a linha é que dizem onde ele está. */
.cartao { display: grid; gap: var(--esp-1); width: 100%; min-height: var(--toque); padding: var(--esp-2) var(--esp-3); border: var(--linha); border-radius: var(--raio-controle); background: var(--superficie); color: var(--texto); text-align: left; cursor: pointer; transition: opacity 160ms; }
.cartao:hover { background: var(--hover); }
.cartao__nome { font-weight: var(--peso-forte); line-height: 1.3; }
.cartao__codigo { color: var(--texto-2); font-size: var(--tam-mini); font-weight: var(--peso-medio); }
/* Escolhido é amarelo, sem sombra: a sombra é do primário (BP-R2). */
.cartao.escolhido { background: var(--destaque); color: var(--destaque-texto); }
.cartao.escolhido .cartao__codigo { color: var(--destaque-texto); }
.cartao.apagado { opacity: 0.4; }
.app.lista .cartao.apagado { display: none; }
.selo { justify-self: start; padding: 0 var(--esp-2); border-radius: var(--raio-selo); background: var(--acento); color: var(--sobre-pastel); font-size: var(--tam-mini); font-weight: var(--peso-forte); letter-spacing: 0.06em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .cartao { transition: none; } }

/* Quadro */
.grade { position: relative; display: grid; gap: 0 var(--esp-3); padding: var(--esp-4) var(--esp-4) var(--esp-8); width: max-content; min-width: 100%; }
.faixa { position: sticky; left: 0; z-index: 2; display: grid; align-content: center; gap: var(--esp-1); padding: var(--esp-3) var(--esp-3) var(--esp-3) 0; background: var(--fundo); }
.faixa b { font-size: var(--tam-apoio); font-weight: var(--peso-forte); line-height: 1.2; }
.faixa span { color: var(--texto-2); font-size: var(--tam-mini); line-height: 1.3; }
.celula { position: relative; z-index: 1; display: grid; align-content: start; gap: var(--esp-2); padding: var(--esp-3) 0; min-width: 0; }
/* Cabeçalho dos passos fica no topo ao rolar para baixo: sem ele, nas faixas de baixo não se sabe de que passo é a coluna. */
.passo { position: sticky; top: 0; z-index: 3; display: grid; align-content: end; gap: var(--esp-1); padding: var(--esp-3) 0; border-bottom: var(--linha); background: var(--fundo); }
.faixa.canto { top: 0; z-index: 4; }
.passo__nome { display: flex; align-items: start; gap: var(--esp-2); font-weight: var(--peso-titulo); line-height: 1.2; }
.n { display: inline-grid; flex: none; place-items: center; min-width: 1.75rem; height: 1.75rem; border-radius: var(--raio-selo); background: var(--texto); color: var(--superficie); font-size: var(--tam-apoio); font-weight: var(--peso-forte); font-variant-numeric: tabular-nums; }
.passo__quando { color: var(--texto-2); font-size: var(--tam-apoio); }
.linha { grid-column: 1 / -1; border-top: 2px dashed var(--borda); margin: var(--esp-2) 0; }
.linha.visibilidade { border-top: var(--linha); }
.linha span { position: sticky; left: 0; z-index: 2; display: inline-block; transform: translateY(-55%); padding: 0 var(--esp-2) 0 0; background: var(--fundo); color: var(--texto-2); font-size: var(--tam-mini); font-weight: var(--peso-forte); }
svg.setas { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.setas path[data-de] { fill: none; stroke: var(--texto-2); stroke-width: 1.5; opacity: 0.45; marker-end: url(#seta); }
svg.setas path.acesa { stroke: var(--texto); stroke-width: 3; opacity: 1; marker-end: url(#seta-acesa); }
svg.setas path.apagada { opacity: 0.1; }

/* Lista (celular) */
.etapa { display: grid; gap: var(--esp-3); }
.etapa__cabeca { display: grid; gap: var(--esp-1); padding-bottom: var(--esp-2); border-bottom: var(--linha); }
.etapa__cabeca h2 { display: flex; align-items: start; gap: var(--esp-2); font-size: var(--tam-nome); font-weight: var(--peso-titulo); line-height: 1.25; }
.grupo { display: grid; gap: var(--esp-2); }
.grupo h3 { font-size: var(--tam-apoio); font-weight: var(--peso-forte); color: var(--texto-2); }
.linha-lista { padding-top: var(--esp-2); border-top: var(--linha); color: var(--texto-2); font-size: var(--tam-mini); font-weight: var(--peso-forte); }

/* Painel (quadro) e folha (lista) mostram o mesmo conteúdo. */
.painel { min-width: 0; overflow-y: auto; border-left: var(--linha); background: var(--superficie); padding: var(--respiro-bloco); }
.app.lista .painel { display: none; }
.detalhe { display: grid; align-content: start; gap: var(--respiro-bloco); }
.detalhe h2 { font-size: var(--tam-secao); font-weight: var(--peso-titulo); letter-spacing: -0.02em; line-height: 1.15; }
.detalhe__meta { color: var(--texto-2); font-size: var(--tam-apoio); }
.detalhe__meta .codigo { color: var(--texto); font-weight: var(--peso-forte); }
.detalhe__topo { display: grid; gap: var(--esp-2); }
.secao { display: grid; gap: var(--esp-2); padding-top: var(--esp-4); border-top: var(--divisor); }
.secao h3 { font-size: var(--tam-apoio); font-weight: var(--peso-forte); }
.secao ul { padding-left: var(--esp-5); display: grid; gap: var(--esp-1); }
.secao li::marker { color: var(--texto-2); }
.arquivos { list-style: none; padding: 0 !important; }
.arquivos li { font-size: var(--tam-apoio); overflow-wrap: anywhere; }
.ficha { display: grid; grid-template-columns: max-content 1fr; gap: var(--esp-2) var(--esp-3); }
.ficha dt { color: var(--texto-2); font-size: var(--tam-apoio); font-weight: var(--peso-medio); padding-top: 0.1em; }
/* O "o que fazer aqui" em zona de realce: fundo, não outra caixa (BP-R1). */
.dica { padding: var(--respiro-interno); border-radius: var(--raio-controle); background: var(--realce); font-size: var(--tam-apoio); }
.dobra summary { min-height: var(--toque); display: flex; align-items: center; font-size: var(--tam-apoio); font-weight: var(--peso-forte); cursor: pointer; }
.dobra ul { padding-left: var(--esp-5); display: grid; gap: var(--esp-1); }
.dobra { padding-top: var(--esp-2); border-top: var(--divisor); }
.dobra[open] ul { padding-bottom: var(--esp-2); }
.fonte { color: var(--texto-2); font-size: var(--tam-mini); overflow-wrap: anywhere; }
.vizinhos { list-style: none; padding: 0 !important; gap: 0 !important; }
.vizinhos button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--esp-3); min-height: var(--toque); padding: var(--esp-1) var(--esp-2); border: 0; border-bottom: var(--divisor); background: none; text-align: left; cursor: pointer; }
.vizinhos button:hover { background: var(--hover); }
.vizinhos small { color: var(--texto-2); font-size: var(--tam-mini); font-weight: var(--peso-medio); white-space: nowrap; }

.acao { display: flex; flex-wrap: wrap; align-items: center; gap: var(--esp-2) var(--esp-3); }
.primario, .secundario { min-height: var(--toque); padding: 0 var(--esp-4); border: var(--linha); border-radius: var(--raio-controle); font-weight: var(--peso-forte); cursor: pointer; }
.primario { background: var(--destaque); color: var(--destaque-texto); box-shadow: var(--sombra); }
.primario:hover { filter: brightness(0.95); }
.primario:active { transform: translate(2px, 2px); box-shadow: var(--sombra-pequena); }
.secundario { background: var(--superficie); color: var(--texto); }
.secundario:hover { background: var(--hover); }
.aviso { font-size: var(--tam-apoio); color: var(--texto-2); }
.aviso:empty { display: none; }
.recurso { width: 100%; min-height: 8rem; font-size: var(--tam-apoio); }

dialog.folha { width: 100%; max-width: 100%; max-height: 88vh; margin: auto 0 0; padding: 0; border: 0; border-top: var(--linha); border-radius: var(--raio-bloco) var(--raio-bloco) 0 0; background: var(--superficie); color: var(--texto); }
dialog.folha::backdrop { background: var(--veu); }
.folha__barra { border-radius: var(--raio-bloco) var(--raio-bloco) 0 0; position: sticky; top: 0; z-index: 1; display: flex; justify-content: end; padding: var(--esp-2) var(--esp-4); background: var(--superficie); border-bottom: var(--divisor); }
.folha__corpo { padding: var(--esp-4) var(--esp-4) calc(var(--esp-8) + env(safe-area-inset-bottom, 0px)); }
.erro { padding: var(--esp-6) var(--esp-4); }
</style>

<div class="app lista" id="app">
  <header class="topo">
    <div>
      <h1>Service blueprint</h1>
      <p>Cada serviço do SquadOne passo a passo, do que o cliente vê ao que roda por trás.</p>
    </div>
    <div class="controles">
      <div class="segmentado" id="servicos" role="group" aria-label="Serviço"></div>
      <label class="campo" for="busca">Buscar<input id="busca" type="search" placeholder="vercel, SITE-4" autocomplete="off"></label>
      <label class="campo" for="destacar">Destacar<select id="destacar"></select></label>
      <p class="resultado" id="resultado" role="status"></p>
    </div>
  </header>
  <div class="corpo">
    <main class="palco" id="palco"></main>
    <aside class="painel" id="painel" aria-label="Detalhe"></aside>
  </div>
</div>
<dialog class="folha" id="folha" aria-labelledby="detalhe-titulo">
  <div class="folha__barra"><button class="secundario" type="button" id="fechar">Fechar</button></div>
  <div class="folha__corpo" id="folha-corpo"></div>
</dialog>

<script>
(() => {
  const $ = (s, raiz = document) => raiz.querySelector(s)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const ABAIXO = new Set(['B', 'A'])
  const CLASSE_DA_LINHA = { C: 'interacao', P: 'visibilidade', B: 'interna' }
  const ROTULO_QUEM = { cliente: 'cliente', 'você': 'Rômulo', 'robô': 'robô', terceiro: 'terceiro' }
  // O nome completo vai no painel; no seletor, uma palavra cabe nos três a 390 px.
  const NOME_CURTO = { SITE: 'Site', PRUMO: 'PRUMO', AGENDA: 'Agenda' }
  const MARCA_NO_PLURAL = { momento: 'Momentos da verdade', dor: 'Pontos de dor', metrica: 'Com métrica', opcao: 'Opções de projeto', seguranca: 'Segurança' }
  const largo = matchMedia('(min-width: 60rem)')

  const app = $('#app'), palco = $('#palco'), painel = $('#painel'), folha = $('#folha'), folhaCorpo = $('#folha-corpo')
  const busca = $('#busca'), destacar = $('#destacar'), resultado = $('#resultado')
  let mapa = null, bp = null, escolhido = null, abridor = null
  const porId = new Map()

  const marcasDe = (c) => [c.momento ? 'momento' : null, ...['dor', 'metrica', 'opcao', 'seguranca'].filter((m) => c[m]?.length)].filter(Boolean)
  const quem = (c) => ROTULO_QUEM[c.quem] ?? c.quem

  function montarServicos() {
    $('#servicos').replaceChildren(...mapa.blueprints.map((b) => {
      const bt = document.createElement('button')
      bt.type = 'button'; bt.textContent = NOME_CURTO[b.id] ?? b.id; bt.dataset.id = b.id; bt.title = b.nome
      bt.onclick = () => abrir(b.id)
      return bt
    }))
  }

  // A contagem fica na própria opção: diz quanto há antes de escolher, sem uma fileira de números à parte.
  function montarDestaque() {
    const antes = destacar.value
    const contar = (m) => bp.cartoes.filter((c) => marcasDe(c).includes(m)).length
    destacar.innerHTML = '<option value="">Nada</option>' + Object.keys(mapa.marcas)
      .map((m) => `<option value="${m}">${esc(MARCA_NO_PLURAL[m] ?? mapa.marcas[m])} (${contar(m)})</option>`).join('')
    destacar.value = antes
  }

  function abrir(id, cartao) {
    bp = mapa.blueprints.find((b) => b.id === id) ?? mapa.blueprints[0]
    porId.clear()
    for (const c of bp.cartoes) porId.set(c.id, c)
    escolhido = null
    for (const b of document.querySelectorAll('#servicos button')) b.setAttribute('aria-pressed', String(b.dataset.id === bp.id))
    montarDestaque()
    desenhar()
    if (cartao && porId.has(cartao)) escolher(cartao, true)
    else { mostrarInicio(); marcarHash(bp.id) }
  }

  function cartaoHtml(c) {
    return `<button type="button" class="cartao" data-id="${esc(c.id)}">
      <span class="cartao__nome">${esc(c.nome)}</span>
      <span class="cartao__codigo codigo">${esc(c.id)}${c.quem === 'cliente' ? '' : ` · ${esc(quem(c))}`}</span>
      ${c.momento ? '<span class="selo">Momento da verdade</span>' : ''}</button>`
  }

  function inicioHtml() {
    return `<div class="detalhe">
      <div class="detalhe__topo"><h2>${esc(bp.nome)}</h2></div>
      <dl class="ficha"><dt>Cliente</dt><dd>${esc(bp.cliente)}</dd><dt>Objetivo</dt><dd>${esc(bp.objetivo)}</dd></dl>
      <p class="dica">Toque num cartão para ver onde ele mora no código, o que medir e o que pode dar errado. Para falar de um cartão com um agente, cite o código dele (<span class="codigo">SITE-3-B2</span>) ou copie o contexto.</p>
      ${bp.melhorias?.length ? `<details class="dobra"${largo.matches ? ' open' : ''}><summary>Melhorias em aberto (${bp.melhorias.length})</summary><ul>${bp.melhorias.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></details>` : ''}
      <p class="fonte">Fonte: docs/blueprint/servico.json · versão ${esc(mapa.versao)} · ${esc(mapa.atualizado)}</p>
    </div>`
  }

  function desenhar() {
    app.classList.toggle('quadro', largo.matches)
    app.classList.toggle('lista', !largo.matches)
    if (largo.matches) desenharQuadro(); else desenharLista()
  }

  function desenharQuadro() {
    const n = bp.passos.length
    const partes = ['<div class="faixa canto"><b>Passos</b><span>em ordem de tempo</span></div>']
    bp.passos.forEach((p, i) => partes.push(`<div class="passo"><span class="passo__nome"><span class="n">${i + 1}</span>${esc(p.nome)}</span><span class="passo__quando">${esc(p.tempo || '')}</span></div>`))
    for (const f of mapa.faixas) {
      partes.push(`<div class="faixa"><b>${esc(f.nome)}</b><span>${esc(f.sub)}</span></div>`)
      for (const p of bp.passos) partes.push(`<div class="celula">${bp.cartoes.filter((c) => c.passo === p.id && c.faixa === f.id).map(cartaoHtml).join('')}</div>`)
      const linha = mapa.linhas.find((l) => l.depois === f.id)
      if (linha) partes.push(`<div class="linha ${CLASSE_DA_LINHA[f.id] ?? ''}"><span>${esc(linha.nome)}</span></div>`)
    }
    palco.innerHTML = `<div class="grade" id="grade" style="grid-template-columns: minmax(7.5rem, 9rem) repeat(${n}, minmax(12.5rem, 14rem))">${partes.join('')}
      <svg class="setas" aria-hidden="true"><defs>
        <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--texto-2)"/></marker>
        <marker id="seta-acesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--texto)"/></marker></defs><g></g></svg></div>`
    ligarCartoes()
    observador.disconnect(); observador.observe($('#grade'))
    requestAnimationFrame(() => { setas(); pintar() })
  }

  function desenharLista() {
    const etapas = bp.passos.map((p, i) => {
      const grupos = []
      let passouDaLinha = false
      for (const f of mapa.faixas) {
        const cs = bp.cartoes.filter((c) => c.passo === p.id && c.faixa === f.id)
        if (!cs.length) continue
        if (ABAIXO.has(f.id) && !passouDaLinha) { passouDaLinha = true; grupos.push('<p class="linha-lista">Daqui para baixo o cliente não vê</p>') }
        grupos.push(`<div class="grupo" data-grupo><h3>${esc(f.nome)}</h3>${cs.map(cartaoHtml).join('')}</div>`)
      }
      return `<section class="etapa" data-etapa><div class="etapa__cabeca"><h2><span class="n">${i + 1}</span>${esc(p.nome)}</h2><span class="passo__quando">${esc(p.tempo || '')}</span></div>${grupos.join('')}</section>`
    })
    palco.innerHTML = `<section id="intro">${inicioHtml()}</section>${etapas.join('')}`
    ligarCartoes()
    pintar()
  }

  function ligarCartoes() {
    for (const b of palco.querySelectorAll('.cartao')) b.onclick = () => escolher(b.dataset.id)
  }

  // Setas em cotovelo: na mesma coluna, reta; entre colunas, pela lateral.
  function setas() {
    const grade = $('#grade'), g = grade && $('svg.setas g', grade)
    if (!g) return
    const base = grade.getBoundingClientRect()
    const caixa = (id) => { const e = $(`.cartao[data-id="${CSS.escape(id)}"]`, grade); if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height } }
    g.innerHTML = bp.ligacoes.map(([de, para]) => {
      const a = caixa(de), b = caixa(para)
      if (!a || !b) return ''
      let d
      if (Math.abs(a.x - b.x) < 4) {
        const desce = b.y > a.y, x = a.x + a.w / 2
        d = `M${x} ${desce ? a.y + a.h : a.y} L${x} ${desce ? b.y - 2 : b.y + b.h + 2}`
      } else {
        const dir = b.x > a.x
        const x1 = dir ? a.x + a.w : a.x, y1 = a.y + a.h / 2, x2 = dir ? b.x - 2 : b.x + b.w + 2, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2
        d = `M${x1} ${y1} L${mx} ${y1} L${mx} ${y2} L${x2} ${y2}`
      }
      return `<path d="${d}" data-de="${esc(de)}" data-para="${esc(para)}"/>`
    }).join('')
    pintar()
  }

  function casa(c, q, marca) {
    if (marca && !marcasDe(c).includes(marca)) return false
    if (!q) return true
    return [c.id, c.nome, c.resumo, quem(c), ...(c.arquivos || []), ...(c.dor || []), ...(c.metrica || []), ...(c.opcao || []), ...(c.seguranca || []), ...(c.melhorias || [])]
      .some((s) => String(s).toLowerCase().includes(q))
  }

  function pintar() {
    if (!bp) return
    const q = busca.value.trim().toLowerCase(), marca = destacar.value
    const perto = new Set()
    if (escolhido) { perto.add(escolhido); for (const [de, para] of bp.ligacoes) { if (de === escolhido) perto.add(para); if (para === escolhido) perto.add(de) } }
    let achados = 0
    for (const e of palco.querySelectorAll('.cartao')) {
      const c = porId.get(e.dataset.id), bate = casa(c, q, marca)
      if (bate) achados++
      e.classList.toggle('escolhido', c.id === escolhido)
      // Na lista, o escolhido abre numa folha por cima: apagar os outros só esconderia a lista.
      e.classList.toggle('apagado', !bate || (largo.matches && escolhido && !perto.has(c.id)))
    }
    if (!largo.matches) {
      for (const g of palco.querySelectorAll('[data-grupo]')) g.hidden = !g.querySelector('.cartao:not(.apagado)')
      for (const s of palco.querySelectorAll('[data-etapa]')) {
        const vazio = !s.querySelector('.cartao:not(.apagado)')
        s.hidden = vazio
        const linha = $('.linha-lista', s)
        if (linha) linha.hidden = ![...s.querySelectorAll('[data-grupo]')].some((g) => !g.hidden && ABAIXO.has(mapa.faixas.find((f) => f.nome === $('h3', g).textContent)?.id))
      }
    }
    for (const p of palco.querySelectorAll('svg.setas path[data-de]')) {
      const ligada = escolhido && (p.dataset.de === escolhido || p.dataset.para === escolhido)
      p.classList.toggle('acesa', Boolean(ligada))
      p.classList.toggle('apagada', Boolean((escolhido && !ligada) || q || marca))
    }
    resultado.textContent = !q && !marca ? ''
      : achados ? `${achados} de ${bp.cartoes.length} cartões${q ? ` com “${busca.value.trim()}”` : ''}.`
      : `Nenhum cartão${q ? ` com “${busca.value.trim()}”` : ''} neste serviço. Limpe a busca ou troque o destaque.`
  }

  function lista(titulo, itens) {
    return itens?.length ? `<section class="secao"><h3>${titulo}</h3><ul>${itens.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></section>` : ''
  }

  function detalheHtml(c) {
    const passo = bp.passos.find((p) => p.id === c.passo)
    const faixa = mapa.faixas.find((f) => f.id === c.faixa)
    const viz = (outro, rumo) => `<li><button type="button" data-ir="${esc(outro)}"><span>${rumo} ${esc(porId.get(outro)?.nome ?? outro)}</span><small class="codigo">${esc(outro)}</small></button></li>`
    const vem = bp.ligacoes.filter(([, p]) => p === c.id).map(([d]) => viz(d, 'Vem de:'))
    const vai = bp.ligacoes.filter(([de]) => de === c.id).map(([, p]) => viz(p, 'Leva a:'))
    return `<div class="detalhe">
      <div class="detalhe__topo">
        <p class="detalhe__meta"><span class="codigo">${esc(c.id)}</span> · ${esc(faixa?.nome)} · passo ${bp.passos.indexOf(passo) + 1}, ${esc(passo?.nome)} · ${esc(quem(c))}</p>
        <h2 id="detalhe-titulo">${esc(c.nome)}</h2>
        ${c.momento ? '<span class="selo">Momento da verdade</span>' : ''}
        <p>${esc(c.resumo)}</p>
      </div>
      <div class="acao"><button class="primario" type="button" data-copiar>Copiar para a conversa</button><p class="aviso" role="status"></p></div>
      ${c.arquivos?.length ? `<section class="secao"><h3>Onde mora</h3><ul class="arquivos">${c.arquivos.map((a) => `<li class="codigo">${esc(a)}</li>`).join('')}</ul></section>` : ''}
      ${lista('Pontos de dor', c.dor)}${lista('Métricas', c.metrica)}${lista('Opções de projeto', c.opcao)}${lista('Segurança', c.seguranca)}${lista('Melhorias', c.melhorias)}
      ${vem.length || vai.length ? `<section class="secao"><h3>Ligações</h3><ul class="vizinhos">${vem.join('')}${vai.join('')}</ul></section>` : ''}
      ${largo.matches ? `<div><button class="secundario" type="button" data-voltar>Voltar a ${esc(NOME_CURTO[bp.id] ?? bp.id)}</button></div>` : ''}
    </div>`
  }

  function contextoDoCartao(c) {
    const passo = bp.passos.find((p) => p.id === c.passo)
    const faixa = mapa.faixas.find((f) => f.id === c.faixa)
    const nome = (id) => porId.get(id)?.nome ?? id
    const saem = bp.ligacoes.filter(([de]) => de === c.id).map(([, para]) => `- → ${para} (${nome(para)})`)
    const chegam = bp.ligacoes.filter(([, para]) => para === c.id).map(([de]) => `- ← ${de} (${nome(de)})`)
    const bloco = (t, xs) => (xs?.length ? `\n${t}:\n${xs.map((x) => `- ${x}`).join('\n')}` : '')
    return [
      `Service blueprint do SquadOne · ${c.id} · ${c.nome}`,
      `Serviço ${bp.id} (${bp.nome}), passo ${passo?.id} "${passo?.nome}" (${passo?.tempo ?? ''}), faixa ${faixa?.nome}. Quem: ${quem(c)}.${c.momento ? ' Momento da verdade.' : ''}`,
      `Fonte: docs/blueprint/servico.json (versão ${mapa.versao}, ${mapa.atualizado}).`,
      '', c.resumo,
      c.arquivos?.length ? `\nArquivos: ${c.arquivos.join(', ')}` : '',
      bloco('Pontos de dor', c.dor), bloco('Métricas', c.metrica), bloco('Opções de projeto', c.opcao), bloco('Segurança', c.seguranca), bloco('Melhorias', c.melhorias),
      saem.length ? `\nLeva a:\n${saem.join('\n')}` : '', chegam.length ? `\nVem de:\n${chegam.join('\n')}` : '',
    ].join('\n').replace(/\n{3,}/g, '\n\n').trim()
  }

  async function copiar(texto, botao, aviso) {
    try {
      await navigator.clipboard.writeText(texto)
      botao.textContent = 'Copiado'
      aviso.textContent = 'Cole na conversa com o agente.'
      setTimeout(() => { botao.textContent = 'Copiar para a conversa'; aviso.textContent = '' }, 2500)
    } catch {
      // Algumas visões do app recusam a área de transferência: o texto fica selecionado para o Ctrl+C.
      aviso.textContent = 'Não deu para copiar sozinho. O texto está selecionado abaixo: use Ctrl+C.'
      let ta = aviso.parentElement.nextElementSibling
      if (!ta?.matches('textarea')) { ta = document.createElement('textarea'); ta.className = 'recurso'; ta.readOnly = true; aviso.parentElement.after(ta) }
      ta.value = texto; ta.focus(); ta.select()
    }
  }

  function mostrarInicio() {
    if (largo.matches) { painel.innerHTML = inicioHtml(); painel.scrollTop = 0 }
  }

  function ligarDetalhe(raiz, c) {
    for (const b of raiz.querySelectorAll('[data-ir]')) b.onclick = () => escolher(b.dataset.ir, true)
    $('[data-copiar]', raiz).onclick = (e) => copiar(contextoDoCartao(c), e.currentTarget, $('.aviso', raiz))
    const voltar = $('[data-voltar]', raiz)
    if (voltar) voltar.onclick = limpar
  }

  function escolher(id, rolar) {
    const c = porId.get(id)
    if (!c) return
    if (escolhido === id && largo.matches) return limpar()
    escolhido = id
    if (largo.matches) {
      painel.innerHTML = detalheHtml(c); painel.scrollTop = 0; ligarDetalhe(painel, c)
      if (rolar) $(`.cartao[data-id="${CSS.escape(id)}"]`, palco)?.scrollIntoView({ block: 'center', inline: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
    } else {
      if (!folha.open) { abridor = document.activeElement; folha.showModal() }
      folhaCorpo.innerHTML = detalheHtml(c); folha.scrollTop = 0; ligarDetalhe(folhaCorpo, c)
    }
    pintar()
    marcarHash(c.id)
  }

  function limpar() {
    escolhido = null
    if (folha.open) folha.close()
    mostrarInicio(); pintar(); marcarHash(bp.id)
  }

  function marcarHash(id) { try { history.replaceState(null, '', '#' + id) } catch {} }

  const observador = new ResizeObserver(() => { if (bp && largo.matches) setas() })
  $('#fechar').onclick = () => folha.close()
  folha.addEventListener('close', () => {
    if (largo.matches) return
    escolhido = null; pintar(); marcarHash(bp.id)
    abridor?.focus?.()
  })
  folha.addEventListener('click', (e) => { if (e.target === folha) folha.close() })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && largo.matches && escolhido && !e.target.matches('input, select')) limpar() })
  busca.addEventListener('input', pintar)
  destacar.addEventListener('change', pintar)
  largo.addEventListener('change', () => {
    if (!bp) return
    const atual = escolhido
    if (folha.open) folha.close()
    escolhido = null
    desenhar()
    if (atual) escolher(atual); else mostrarInicio()
  })
  document.fonts?.ready.then(() => { if (bp && largo.matches) setas() })

  fetch('servico.json').then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json() }).then((dados) => {
    mapa = dados
    montarServicos()
    const alvo = location.hash.slice(1)
    const doCartao = mapa.blueprints.find((b) => b.cartoes.some((c) => c.id === alvo))
    abrir(doCartao?.id ?? alvo, doCartao ? alvo : undefined)
  }).catch((e) => {
    palco.innerHTML = `<div class="erro detalhe"><h2>O blueprint não carregou</h2><p>O arquivo servico.json não veio (${esc(e.message)}). Ele precisa estar publicado ao lado desta página; republique os dois juntos.</p></div>`
  })
})()
</script>
