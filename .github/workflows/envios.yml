name: Regressões de envio
on:
  push:
  pull_request:
jobs:
  envios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run test:envios
      - run: npm run test:aquisicao
      - run: python3 deploy/dell/atualizar_central.test.py
      - name: Regressões resgatadas do RevOps
        run: |
          python3 deploy/dell/whatsapp-observador/evolution-adaptador.test.py
          python3 deploy/dell/whatsapp-observador/entrada-duravel.test.py
          python3 deploy/dell/claude-ops/workflow_confiabilidade.test.py
          python3 deploy/dell/prumo-mapa/modelo_mapa.test.py
